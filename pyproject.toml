[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yrcom"
version = "0.3.2"
description = "Yaskawa robot communication — Ethernet Server, HSES and HSES File Control (pure stdlib)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "cmosbk" }]
keywords = ["yaskawa", "robot", "hses", "ethernet-server", "motoman", "yrc1000"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26", "black>=24"]

[project.scripts]
yrcom-sim = "yrcom.hses_sim:_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/CMOSBK/yrcom"
Issues = "https://github.com/CMOSBK/yrcom/issues"
